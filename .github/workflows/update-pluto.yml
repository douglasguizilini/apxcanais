name: Atualizar playlist Pluto TV

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar streams
        run: python update_pluto.py

      - name: Publicar alterações
        run: |
          if git diff --quiet -- plutotv_brasil_v2_categorizada.m3u; then
            echo "Nenhuma alteração na playlist."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plutotv_brasil_v2_categorizada.m3u
          git commit -m "Atualiza streams Pluto TV"
          git push
